plugins {
    id 'java'
    id 'application'
}

group = 'org.neatore.calisync'
version = '0.0.1'

repositories {
    mavenCentral()
}

run {
    mainClass = "org.neatore.calisync.CaliSync"
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}