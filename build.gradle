subprojects {
    version = "0.0.1"

    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation 'org.apache.logging.log4j:log4j-core:2.25.3'
        implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.1'
    }

    repositories {
        mavenCentral()
    }

    test {
        useJUnitPlatform()
    }
}